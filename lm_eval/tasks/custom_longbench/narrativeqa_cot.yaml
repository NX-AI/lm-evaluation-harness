include: narrativeqa.yaml

tag:
  - custom_longbench_cot_tasks
task: custom_longbench_narrativeqa_cot
doc_to_text: "You are given a story, which can be either a novel or a movie script, and a question. Think step by step in a concise way. Then give the final answer as \"Answer: <text>\", where <text> is as concise as possible and uses a single phrase if possible.\n\nStory: {{context}}\n\nQuestion: {{question}}\n\nResponse:"
process_results: !function utils_cot.get_qa_f1_with_score
filter_list:
  - name: none
    filter:
      - function: custom
        filter_fn: !function utils_cot.filter_responses
      - function: take_first
