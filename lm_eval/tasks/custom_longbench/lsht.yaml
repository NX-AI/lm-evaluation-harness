
tag:
  - custom_longbench_fewshot_tasks
  - custom_longbench_tasks
task: custom_longbench_lsht
custom_dataset: !function common_utils.load_longbench_dataset
dataset_kwargs:
  repo_id: zai-org/LongBench
  dataset_name: lsht
  split: test
dataset_path: zai-org/LongBench
test_split: test
dataset_name: lsht
doc_to_text: "请判断给定新闻的类别，下面是一些例子。\n\n{{context}}\n{{question}}"
doc_to_target: '{{answers}}'
process_results: !function metrics.get_classification_with_score
generation_kwargs:
  max_gen_toks: 64
  temperature: 1
  do_sample: False
  until: ["\n"]
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "classification_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
