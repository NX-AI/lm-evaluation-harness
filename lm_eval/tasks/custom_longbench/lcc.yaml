
tag:
  - custom_longbench_code_tasks
  - custom_longbench_tasks
task: custom_longbench_lcc
custom_dataset: !function common_utils.load_longbench_dataset
dataset_kwargs:
  repo_id: zai-org/LongBench
  dataset_name: lcc
  split: test
dataset_path: zai-org/LongBench
test_split: test
dataset_name: lcc
doc_to_text: "Please complete the code given below. \n{{context}}Next line of code:"
doc_to_target: '{{answers}}'
process_results: !function metrics.get_code_sim_with_score
generation_kwargs:
  max_gen_toks: 64
  temperature: 1
  do_sample: False
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "code_sim_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
